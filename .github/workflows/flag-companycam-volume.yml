name: Flag high-volume untagged CompanyCam projects

on:
  schedule:
    - cron: "0 6 * * *"  # once daily, 6am UTC
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  flag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Flag high-volume untagged projects
        env:
          COMPANYCAM_API_TOKEN: ${{ secrets.COMPANYCAM_API_TOKEN }}
        run: npm run flag:companycam-volume

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Flag high-volume untagged CompanyCam projects"
          git push
